interface:
  display_name: "三栏交互原型工作台"
  short_description: "按产品与二级菜单组织三栏原型，保留原交互，标注联动，导出 HTML 只读"
  default_prompt: "使用 $pm-prototype-workbench 把这些 HTML 转成三栏工作台，首个菜单「全局内容」打开独立正文页并直接填写，其后产品为一级分组，全局说明与页面为左侧二级菜单，页面标明端和需求，中间不增加页面 Tab，每个产品正文独立保存，右侧保留原研发说明区，保留原交互和已有说明，中间顶部紧凑左右排列，只保留查看原型，用小按钮单次选择任意可见元素写说明，选完恢复操作，下次需再次开启，已有说明直接在原位置编辑，文本框默认较大并随内容完整展开，不主动补写业务逻辑。默认只交付可编辑工作 HTML，保留手动导出只读 HTML 的功能，不主动下载只读预览。"

policy:
  allow_implicit_invocation: true
