/* One text field for every page note. */
.simple-editor .editor-head{font-size:11px;font-weight:400;line-height:1.7;margin-bottom:12px}
.simple-editor textarea{display:block;width:100%;min-height:84px;padding:11px 12px;font-size:13px;line-height:1.8;margin:0}
.simple-editor textarea:disabled{background:#fffaf5;color:var(--muted);cursor:default}
.simple-editor .editor-actions{margin-top:12px}
.simple-note .note-top{align-items:flex-start;gap:10px;margin-bottom:0}
.simple-note .note-number{margin-top:1px}
.simple-note .note-body{flex:1;min-width:0;color:var(--ink);font-size:12px;line-height:1.9}
.simple-note .note-loc,.simple-note .note-controls{margin-left:32px}
.simple-note.note-selected{background:var(--orange-light)}
.note-inline-editor{flex:1;min-width:0;margin:0;padding:0;border:0;background:transparent}
.note-inline-editor textarea{width:100%;min-height:130px;max-height:360px;resize:vertical;font-size:12px;line-height:1.9;border-color:var(--note-color);background:var(--paper)}
.note-inline-editor .editor-actions{margin-top:8px}
.note-number.note-link{border-radius:50%;padding:0}
.picking #prototype :is(#list-pane,#form-panel),.picking #prototype :is(#list-pane,#form-panel) *{pointer-events:auto!important}

.readonly-badge{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid #d4e5d9;border-radius:6px;background:var(--green-light);color:var(--green);font-size:12px}
/* Text remains expanded; linked focus is the only read interaction in the sidebar. */
.note-link{cursor:pointer;border-radius:5px;outline-offset:5px}.note-link:hover{background:var(--orange-light)}.note-link:focus-visible{outline:2px solid var(--orange)}
#prototype .pin,.picking #prototype .pin{pointer-events:auto;cursor:pointer}.pin[aria-current=location]{box-shadow:0 0 0 3px var(--orange-line)}
#prototype .selected-target{outline:2px solid var(--orange);outline-offset:4px;border-radius:4px}

/* Per-note colors and non-blocking annotation overlays. */
.annotation-frames-toggle{display:inline-flex;align-items:center;gap:8px;padding:8px 0;background:transparent;border:0;color:#52665b;font-size:12px;white-space:nowrap;cursor:pointer}
.annotation-switch-track{width:30px;height:18px;position:relative;border-radius:12px;background:#34775b;flex:none}
.annotation-switch-track:after{content:"";position:absolute;width:12px;height:12px;top:3px;left:15px;background:white;border-radius:50%;box-shadow:0 1px 2px #0002}
.annotation-frames-toggle[aria-checked=false] .annotation-switch-track{background:#a6afa9}.annotation-frames-toggle[aria-checked=false] .annotation-switch-track:after{left:3px}
#prototype #wb-pin-layer{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
#prototype .annotation-frame{position:absolute;pointer-events:none;border:2px solid var(--note-color);border-radius:5px;background:transparent;box-sizing:border-box}
#prototype .annotation-frame.focused{border-width:3px;box-shadow:0 0 0 3px var(--note-ring)}
#prototype .wb-pin{position:absolute;z-index:2;display:grid;place-items:center;width:auto;min-width:22px;height:22px;margin:0;padding:0 4px;border:2px solid #fff;border-radius:50%;background:var(--note-color);color:#fff;font:10px/1 -apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 1px 3px #0002;pointer-events:auto;cursor:pointer!important;white-space:nowrap}
#prototype .wb-pin.focused{box-shadow:0 0 0 3px var(--note-ring)}
.picking #prototype .wb-pin{pointer-events:auto}
#prototype .wb-pin:hover,#prototype .wb-pin:focus-visible{background:var(--note-color);outline:2px solid var(--note-color);outline-offset:2px}
.note-number{background:var(--note-color)!important}.note-selected,.simple-note.note-selected{background:var(--note-soft)}.note-selected .note-number{box-shadow:0 0 0 4px var(--note-ring)}
.note-selected .note-body{color:#253d35}.note-link:hover{background:var(--note-soft)}.note-link:focus-visible{outline-color:var(--note-color)}
#prototype .selected-target{outline-color:var(--note-color,#ba682f)!important}
#prototype.annotation-frames-hidden .annotation-frame{display:none}
#prototype.annotation-frames-hidden .annotation-frame.focused.peek{display:block}
#prototype.annotation-frames-hidden .selected-target{outline:none!important}

/* Only the frame edges receive overlay clicks; the interior stays native business UI. */
#prototype .annotation-frame-hit{position:absolute;display:block;pointer-events:auto;cursor:pointer;background:transparent}
#prototype .annotation-frame-hit[data-edge=top]{top:-2px;left:-2px;right:-2px;height:6px}
#prototype .annotation-frame-hit[data-edge=bottom]{bottom:-2px;left:-2px;right:-2px;height:6px}
#prototype .annotation-frame-hit[data-edge=left]{left:-2px;top:4px;bottom:4px;width:6px}
#prototype .annotation-frame-hit[data-edge=right]{right:-2px;top:4px;bottom:4px;width:6px}

/* Global text and explicit, one-click annotation targeting. */
[data-global-slot]{min-width:0;margin:12px 0 0}
.global-note{padding:10px 11px;border:1px solid #dde5dc;border-radius:7px;background:#fafcf8;color:#354e41}

.global-note textarea{display:block;resize:vertical;width:100%;max-width:100%;min-height:56px;max-height:180px;padding:7px 8px;border:1px solid #d3dfd2;border-radius:4px;background:#fff;color:#354e41;font-family:inherit;font-size:12px;line-height:1.65}

function anchorKnown(n){

 const fixed={channels:['name-column','channel-tags','status-column','create-channel','form-page','channel-name','channel-category','category-field','tags-field','close-modal','cancel-channel','save-channel'],tags:['category-tabs','add-item','new-text','add-button'],comments:['comment-list','form-page','review-content','close-modal','cancel-review','reject-review','approve-review'],words:['add-item','new-text','add-button']};
 if(common.concat(fixed[n.page]||[]).includes(n.anchor))return true;
 if(n.page==='channels')return data().channels.some(r=>['row-name-','row-tags-','row-status-','row-action-','edit-','toggle-'].some(p=>n.anchor===p+r.id));

 return false;
}

  const location='<div class="note-loc">'+icon('pin',12)+'<span>'+esc(n.location)+(exists?'':'<br><span class="missing-location">'+noteLocationStatus(n)+'</span>')+'</span></div>';
  const content=editing?'<div class="note-top"><button type="button" class="note-number note-link" '+locate+'>'+pad(n.id)+'</button>'+editorHTML(n.id)+'</div>'+location:'<div class="note-link" role="button" tabindex="0" '+locate+'><div class="note-top"><span class="note-number">'+pad(n.id)+'</span><p class="note-body">'+esc(n.body)+'</p></div>'+location+'</div>';
  return '<article class="note simple-note'+(current?' current-scene':'')+(selected?' note-selected':'')+'" id="note-'+n.id+'" style="'+noteStyle(n.id)+'" data-note-scene="'+n.scene+'">'+content+(!readOnly&&!editing?'<div class="note-controls"><button type="button" data-note-edit="'+n.id+'">编辑</button><button type="button" data-note-rebind="'+n.id+'">重新定位</button><button type="button" data-note-delete="'+n.id+'">删除</button></div>':'')+'</article>';}).join('');
 $$('.note-link').forEach(el=>{el.onclick=activateNote;el.onkeydown=activateNote;});
 if($('#note-form')){$('#note-form').onsubmit=saveNote;if($('#cancel-note'))$('#cancel-note').onclick=()=>{const id=draft()?.noteId;if(!abandonDraft())return;persist();if(id)refreshNoteInPlace(id);else {renderSidebar();paintPins();renderDirectory();}};$('#note-body').oninput=captureDraft;}
 growEditors();
 if($('#cancel-rebind'))$('#cancel-rebind').onclick=()=>{rebindId=null;stopPicking();renderSidebar();paintPins();};
 $$('[data-note-edit]').forEach(b=>b.onclick=()=>{if(!abandonDraft())return;stopPicking();const n=model.notes.find(n=>n.id===Number(b.dataset.noteEdit));model.drafts[model.activePage]={anchor:n.anchor,location:n.location,scene:n.scene,context:clone(n.context||null),noteId:n.id,dirty:false,values:{body:n.body}};focusedNote=n.id;persist();refreshNoteInPlace(n.id,true);});
 $$('[data-note-rebind]').forEach(b=>b.onclick=()=>{if(!abandonDraft())return;rebindId=Number(b.dataset.noteRebind);pickingTarget=true;updatePickUI();paintPins();persist();renderSidebar();$('#notes-scroll').scrollTop=0;});
 $$('[data-note-delete]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.noteDelete);if(draft()?.noteId===id&&!abandonDraft())return;undoNote=model.notes.find(n=>n.id===id);model.notes=model.notes.filter(n=>n.id!==id);persist();renderAll();toast('已删除说明 #'+pad(id),true);});
}
function renderLocateOptions(){
 $('#locate-note').innerHTML='<option value="">选择编号，在页面上定位</option>'+notes().map(n=>'<option value="'+n.id+'"'+(focusedNote===n.id?' selected':'')+'>#'+pad(n.id)+' '+esc(notePreview(n))+'</option>').join('');
}
function refreshNoteInPlace(id,focusEditor=false){
 const scroll=$('#notes-scroll'),before=$('#note-'+id)?.getBoundingClientRect().top;
 renderSidebar();renderDirectory();renderLocateOptions();paintPins();
 const note=$('#note-'+id);if(note&&before!==undefined)scroll.scrollTop+=note.getBoundingClientRect().top-before;
 (focusEditor?$('#note-body',note):$('[data-note-edit="'+id+'"]'))?.focus({preventScroll:true});
}
function captureDraft(){if(readOnly)return;const d=draft();if(!d)return;d.dirty=true;d.values={body:$('#note-body').value};growEditors();persist();renderDirectory();}
function saveNote(e){e.preventDefault();if(readOnly)return;const d=draft();if(!d)return;const values={body:$('#note-body').value.trim()};if(!values.body){toast('请先写一句话');$('#note-body').focus();return;}
 const record={id:d.noteId||model.counters.note++,requirement:page().req,page:model.activePage,scene:d.scene,anchor:d.anchor,location:d.location,context:d.context,...values};
 if(d.noteId)model.notes=model.notes.map(n=>n.id===d.noteId?record:n);else model.notes.push(record);delete model.drafts[model.activePage];focusedNote=record.id;persist();refreshNoteInPlace(record.id);toast('说明 #'+pad(record.id)+' 已保存，导出 HTML 后即可交付');
}
function activateNote(e){
 if(e.type==='keydown'&&!['Enter',' '].includes(e.key))return false;
 const origin=e.target.closest('[data-note-locate],[data-note-frame-hit],[data-note-entry]');if(!origin)return false;
 e.preventDefault();e.stopImmediatePropagation();const n=origin.dataset.noteEntry?hiddenNoteGroups().get(origin.dataset.noteEntry)?.[0]:model.notes.find(n=>String(n.id)===(origin.dataset.noteLocate||origin.dataset.noteFrameHit));if(!n)return true;
 const selector=origin.closest('.sidebar')?'.sidebar [data-note-locate="'+n.id+'"]':'#prototype [data-note-locate="'+n.id+'"]';const hadFocus=document.activeElement===origin;
 locateNote(n);if(hadFocus||e.type==='keydown')$(selector)?.focus({preventScroll:true});return true;
}
function highlightVisibleNote(n,{scrollTarget=true}={}){
 if(!showAnnotationFrames)revealedFrameId=n.id;
 focusedNote=n.id;$('#locate-note').value=n.id;
 $$('.note').forEach(el=>el.classList.toggle('note-selected',el.id==='note-'+n.id));
 $$('.note-link').forEach(el=>{if(el.dataset.noteLocate===String(n.id))el.setAttribute('aria-current','location');else el.removeAttribute('aria-current');});
 paintPins();if(scrollTarget)findAnchor(n.anchor)?.scrollIntoView?.({block:'nearest',inline:'nearest'});
 $('#note-'+n.id)?.scrollIntoView?.({block:'nearest'});schedulePaint();
}
function highlightRegion(e){
 if(!showAnnotationFrames||pickingTarget)return;
 const root=activeRoot();let target=e.target;
 while(target&&root?.contains(target)){
  const matches=notes().filter(n=>n.scene===scene()&&findAnchor(n.anchor)===target);
  const note=matches.find(n=>n.id===focusedNote)||matches[0];
  if(note){highlightVisibleNote(note,{scrollTarget:false});return;}
  target=target.parentElement;
 }
}
function locateNote(n){
 stopPicking();
 if(noteIsVisible(n)){
  highlightVisibleNote(n);return;
 }
 if(!readOnly&&draft()?.dirty){toast('请先保存或取消说明草稿，再切换定位场景');return;}
 if(!anchorKnown(n)){toast(readOnly?'当前文件未包含这条说明对应的位置':'这条说明的原位置不存在，请重新定位');return;}
 const v=view();if(model.activePage==='channels'&&v.modal)v.savedForm=clone(v.modal);if(n.context){Object.assign(v,clone(n.context));v.errors={};}else{
  v.query=v.queryDraft=v.status=v.statusDraft='';v.errors={};v.preview=n.scene==='list'||n.scene==='form'?'live':n.scene;
  v.modal=n.scene==='form'?(model.activePage==='channels'?{id:null,name:'',category:'',tags:[],active:true}:{id:data().comments.find(r=>r.status==='pending')?.id||data().comments[0].id,previewStatus:'pending'}):null;
 }
 // Older notes may have no captured context. Reveal their row or category explicitly.
 if(n.scene==='list'){v.modal=null;v.preview='live';v.query=v.queryDraft=v.status=v.statusDraft='';}
 if(model.activePage==='tags'){for(const [category,tags] of Object.entries(data().categories))if(tags.some(t=>n.anchor.endsWith(keyForTag(category,t.name))))v.category=category;}
 focusedNote=n.id;if(!showAnnotationFrames)revealedFrameId=n.id;persist();renderAll();const target=findAnchor(n.anchor);target?.scrollIntoView?.({block:'nearest',inline:'nearest'});$('#note-'+n.id)?.scrollIntoView?.({block:'nearest'});if(!elementAvailable(target))toast('当前业务状态下该控件未显示，请查看对应说明');
}
function download(text,filename,mime){const url=URL.createObjectURL(new Blob([text],{type:mime}));const link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);}
function exportReady(){if(readOnly)return false;const unsaved=Object.entries(model.drafts).filter(([id,d])=>d.dirty);if(unsaved.length){toast('请先保存或取消说明草稿：'+unsaved.map(([id])=>pageIdentity(id)).join('、'));return false;}
 const missing=model.notes.filter(n=>!anchorKnown(n));if(missing.length){toast('请先重新定位或删除失效说明：'+missing.map(n=>'#'+pad(n.id)).join('、'));return false;}return true;}
function exportHTML(){if(!exportReady())return;stashPosition();const copy=originalMarkup.cloneNode(true),now=new Date(),snapshot=clone(model);snapshot.drafts={};snapshot.updatedAt=now.toISOString();
 const payload={schemaVersion:3,projectTitle,navigation:clone(navigation),readOnly:true,artifactId:seed.artifactId,snapshotId:'snapshot-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),version:seed.version,savedAt:now.toISOString(),model:snapshot};
 copy.querySelector('#prototype-data').textContent=JSON.stringify(payload).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');copy.querySelector('#app').textContent='';copy.querySelector('title').textContent=projectTitle+' · 只读预览';
 download('<!doctype html>\n'+copy.outerHTML,exportStem+'-只读预览-'+now.getFullYear()+pad(now.getMonth()+1)+pad(now.getDate())+'-'+pad(now.getHours())+pad(now.getMinutes())+'.html','text/html;charset=utf-8');toast('已导出只读 HTML：可体验原型和查看说明，不能标注修改');}
function exportMarkdown(){if(!exportReady())return;const lines=['# '+projectTitle+' · 页面说明','','版本：'+seed.version,'导出时间：'+timestamp(new Date().toISOString()),'编号对应页面上的位置。',''];
 if(model.globalContent)lines.push('## 全局内容','',model.globalContent,'');
 for(const key of ['prototype','notes'])if(model.globalNotes[key])lines.push('## '+globalLabels[key],'',model.globalNotes[key],'');
 productGroups.forEach(group=>{if(model.productGlobalContent[group.id])lines.push('## '+group.name+' · 本产品全局说明','',model.productGlobalContent[group.id],'');});
 menus.forEach(menu=>{if(model.menuGlobalContent[menu.id])lines.push('## '+menu.product+' · '+menu.platform+' / '+menu.name+' · 本菜单全局说明','',model.menuGlobalContent[menu.id],'');});
 requirements.forEach(r=>{lines.push('## '+r.code+' '+r.name,'',r.scope,r.boundary,'');Object.entries(pages).filter(([id,p])=>p.req===r.id).forEach(([id,p])=>{lines.push('### '+pageIdentity(id),'');model.notes.filter(n=>n.page===id).forEach(n=>lines.push('#### #'+pad(n.id),'',n.body,'','- 位置：'+n.location,'- 页面场景：'+p.states[n.scene],'- 定位标识：'+n.requirement+' / '+n.page+' / '+n.scene+' / '+n.anchor,''));});});download(lines.join('\n'),exportStem+'-页面说明.md','text/markdown;charset=utf-8');toast('已导出全部页面说明');}
window.addEventListener('keydown',e=>{if(e.key!=='Escape'||e.defaultPrevented||pickingTarget)return;if(view().modal&&$('#prototype').contains(e.target))closeModal();});
window.addEventListener('beforeunload',e=>{stashPosition();persist();if(!cacheAvailable&&Object.values(model.drafts).some(d=>d.dirty)){e.preventDefault();e.returnValue='';}});
shell();renderAll();
})();

</script>
</body>
